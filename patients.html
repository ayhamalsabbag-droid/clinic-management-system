 Ayham Alsabbagh: <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f5f9;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .patient-form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .patient-form input,
        .patient-form select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .patient-form input:focus,
        .patient-form select:focus {
            outline: none;
            border-color: #3498db;
        }

        .add-button {
            grid-column: 1 / -1;
            padding: 13px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .add-button:hover {
            background: #2980b9;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #3498db;
            color: white;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .edit-button,
        .delete-button {
            padding: 7px 12px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            margin: 2px;
        }

        .edit-button {
            background: #f39c12;
        }

        .edit-button:hover {
            background: #d68910;
        }

        .delete-button {
            background: #e74c3c;
        }

        .delete-button:hover {
            background: #c0392b;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 15px;
            background: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        .back-button:hover {
            background: #1f2d3a;
        }

        @media (max-width: 700px) {
            .patient-form {
                grid-template-columns: 1fr;
            }

            .add-button {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <a href="dashboard.html" class="back-button">
            Back to Dashboard
        </a>

        <h1>Patient Management</h1>

        <p class="subtitle">
            Add, edit and delete patient records
        </p>

        <form id="patientForm" class="patient-form">

            <input
                type="text"
                id="patientName"
                placeholder="Patient Name"
                required
            >

            <input
                type="number"
                id="patientAge"
                placeholder="Age"
                min="1"
                max="120"
                required
            >

            <input
[15/08/2026 10:36 م] Ayham Alsabbagh: type="tel"
                id="patientPhone"
                placeholder="Phone Number"
                required
            >

            <select id="patientGender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <button type="submit" class="add-button" id="submitButton">
                Add Patient
            </button>

        </form>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Patient Name</th>
                        <th>Age</th>
                        <th>Phone</th>
                        <th>Gender</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="patientTableBody">
                </tbody>

            </table>

        </div>

    </div>

    <script>

        const patientForm = document.getElementById("patientForm");

        const patientName = document.getElementById("patientName");
        const patientAge = document.getElementById("patientAge");
        const patientPhone = document.getElementById("patientPhone");
        const patientGender = document.getElementById("patientGender");

        const patientTableBody =
            document.getElementById("patientTableBody");

        const submitButton =
            document.getElementById("submitButton");

        let patients = [];

        let editIndex = -1;


        patientForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const patient = {
                name: patientName.value,
                age: patientAge.value,
                phone: patientPhone.value,
                gender: patientGender.value
            };


            if (editIndex === -1) {

                patients.push(patient);

            } else {

                patients[editIndex] = patient;

                editIndex = -1;

                submitButton.textContent = "Add Patient";
            }


            patientForm.reset();

            displayPatients();

        });


        function displayPatients() {

            patientTableBody.innerHTML = "";


            patients.forEach(function(patient, index) {

                const row = document.createElement("tr");


                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${patient.name}</td>
                    <td>${patient.age}</td>
                    <td>${patient.phone}</td>
                    <td>${patient.gender}</td>

                    <td>
                        <button
                            class="edit-button"
                            onclick="editPatient(${index})">
                            Edit
                        </button>

                        <button
                            class="delete-button"
                            onclick="deletePatient(${index})">
                            Delete
                        </button>
                    </td>
                `;


                patientTableBody.appendChild(row);

            });

        }


        function editPatient(index) {

            const patient = patients[index];

            patientName.value = patient.name;
            patientAge.value = patient.age;
            patientPhone.value = patient.phone;
            patientGender.value = patient.gender;

            editIndex = index;

            submitButton.textContent = "Update Patient";

        }


        function deletePatient(index) {

            const confirmed =
                confirm("Are you sure you want to delete this patient?");

            if (confirmed) {

                patients.splice(index, 1);

                displayPatients();

            }

        }

    </script>

</body>

</html>
