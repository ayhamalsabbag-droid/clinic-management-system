                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <button type="submit" class="add-button" id="submitButton">
                Add Doctor
            </button>

        </form>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Doctor Name</th>
                        <th>Specialty</th>
                        <th>Phone</th>
                        <th>Gender</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="doctorTableBody"></tbody>

            </table>

        </div>

    </div>

    <script>

        const doctorForm = document.getElementById("doctorForm");

        const doctorName = document.getElementById("doctorName");
        const doctorSpecialty = document.getElementById("doctorSpecialty");
        const doctorPhone = document.getElementById("doctorPhone");
        const doctorGender = document.getElementById("doctorGender");

        const doctorTableBody =
            document.getElementById("doctorTableBody");

        const submitButton =
            document.getElementById("submitButton");

        let doctors = [];

        let editIndex = -1;


        doctorForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const doctor = {
                name: doctorName.value,
                specialty: doctorSpecialty.value,
                phone: doctorPhone.value,
                gender: doctorGender.value
            };

            if (editIndex === -1) {

                doctors.push(doctor);

            } else {

                doctors[editIndex] = doctor;

                editIndex = -1;

                submitButton.textContent = "Add Doctor";
            }

            doctorForm.reset();

            displayDoctors();

        });


        function displayDoctors() {

            doctorTableBody.innerHTML = "";

            doctors.forEach(function(doctor, index) {

                const row = document.createElement("tr");

                row.innerHTML = 
                    <td>${index + 1}</td>
                    <td>${doctor.name}</td>
                    <td>${doctor.specialty}</td>
                    <td>${doctor.phone}</td>
                    <td>${doctor.gender}</td>

                    <td>
                        <button
                            class="edit-button"
                            onclick="editDoctor(${index})">
                            Edit
                        </button>

                        <button
                            class="delete-button"
                            onclick="deleteDoctor(${index})">
                            Delete
                        </button>
                    </td>
                ;

                doctorTableBody.appendChild(row);

            });

        }


        function editDoctor(index) {

            const doctor = doctors[index];

            doctorName.value = doctor.name;
            doctorSpecialty.value = doctor.specialty;
            doctorPhone.value = doctor.phone;
            doctorGender.value = doctor.gender;

            editIndex = index;

            submitButton.textContent = "Update Doctor";

        }


        function deleteDoctor(index) {

            const confirmed =
                confirm("Are you sure you want to delete this doctor?");

            if (confirmed) {

                doctors.splice(index, 1);

                displayDoctors();

            }

        }

    </script>

</body>
