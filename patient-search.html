    <script>

        const searchInput =
            document.getElementById("searchInput");

        const clearButton =
            document.getElementById("clearButton");

        const patientTableBody =
            document.getElementById("patientTableBody");

        const resultMessage =
            document.getElementById("resultMessage");


        let patients = [
            {
                name: "John Smith",
                age: 35,
                phone: "555-1001",
                gender: "Male"
            },
            {
                name: "Sarah Johnson",
                age: 28,
                phone: "555-1002",
                gender: "Female"
            },
            {
                name: "Michael Brown",
                age: 45,
                phone: "555-1003",
                gender: "Male"
            }
        ];


        function displayPatients(patientList) {

            patientTableBody.innerHTML = "";

            if (patientList.length === 0) {

                patientTableBody.innerHTML = 
                    <tr>
                        <td colspan="5" class="no-results">
                            No patients found.
                        </td>
                    </tr>
                ;

                resultMessage.textContent =
                    "No patients found.";

                return;
            }


            patientList.forEach(function(patient, index) {

                const row =
                    document.createElement("tr");

                row.innerHTML = 
                    <td>${index + 1}</td>
                    <td>${patient.name}</td>
                    <td>${patient.age}</td>
                    <td>${patient.phone}</td>
                    <td>${patient.gender}</td>
                ;

                patientTableBody.appendChild(row);

            });


            resultMessage.textContent =
                Found ${patientList.length} patient(s).;

        }


        searchInput.addEventListener("input", function() {

            const searchValue =
                searchInput.value.toLowerCase().trim();


            const filteredPatients =
                patients.filter(function(patient) {

                    return (
                        patient.name.toLowerCase().includes(searchValue) ||
                        patient.phone.toLowerCase().includes(searchValue) ||
                        patient.gender.toLowerCase().includes(searchValue)
                    );

                });


            displayPatients(filteredPatients);

        });


        clearButton.addEventListener("click", function() {

            searchInput.value = "";

            displayPatients(patients);

        });


        displayPatients(patients);

    </script>

</body>
