    <script>

        const visitForm =
            document.getElementById("visitForm");

        const patientName =
            document.getElementById("patientName");

        const doctorName =
            document.getElementById("doctorName");

        const visitDate =
            document.getElementById("visitDate");

        const visitType =
            document.getElementById("visitType");

        const visitNotes =
            document.getElementById("visitNotes");

        const visitTableBody =
            document.getElementById("visitTableBody");

        const submitButton =
            document.getElementById("submitButton");

        let visits = [];

        let editIndex = -1;


        visitForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const visit = {

                patient: patientName.value,

                doctor: doctorName.value,

                date: visitDate.value,

                type: visitType.value,

                notes: visitNotes.value

            };


            if (editIndex === -1) {

                visits.push(visit);

            } else {

                visits[editIndex] = visit;

                editIndex = -1;

                submitButton.textContent = "Add Visit";

            }


            visitForm.reset();

            displayVisits();

        });


        function displayVisits() {

            visitTableBody.innerHTML = "";

            visits.forEach(function(visit, index) {

                const row =
                    document.createElement("tr");

                row.innerHTML = 

                    <td>${index + 1}</td>

                    <td>${visit.patient}</td>

                    <td>${visit.doctor}</td>

                    <td>${visit.date}</td>

                    <td>${visit.type}</td>

                    <td>${visit.notes}</td>

                    <td>

                        <button
                            class="edit-button"
                            onclick="editVisit(${index})">
                            Edit
                        </button>

                        <button
                            class="delete-button"
                            onclick="deleteVisit(${index})">
                            Delete
                        </button>

                    </td>

                ;

                visitTableBody.appendChild(row);

            });

        }
