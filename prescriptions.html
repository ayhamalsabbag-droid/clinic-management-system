<body>

    <script>

        const prescriptionForm =
            document.getElementById("prescriptionForm");

        const patientName =
            document.getElementById("patientName");

        const doctorName =
            document.getElementById("doctorName");

        const medicineName =
            document.getElementById("medicineName");

        const dosage =
            document.getElementById("dosage");

        const frequency =
            document.getElementById("frequency");

        const prescriptionDate =
            document.getElementById("prescriptionDate");

        const instructions =
            document.getElementById("instructions");

        const prescriptionTableBody =
            document.getElementById("prescriptionTableBody");

        const submitButton =
            document.getElementById("submitButton");

        let prescriptions = [];

        let editIndex = -1;


        prescriptionForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const prescription = {

                patient: patientName.value,

                doctor: doctorName.value,

                medicine: medicineName.value,

                dosage: dosage.value,

                frequency: frequency.value,

                date: prescriptionDate.value,

                instructions: instructions.value

            };


            if (editIndex === -1) {

                prescriptions.push(prescription);

            } else {

                prescriptions[editIndex] = prescription;

                editIndex = -1;

                submitButton.textContent =
                    "Add Prescription";
            }


            prescriptionForm.reset();

            displayPrescriptions();

        });


        function displayPrescriptions() {

            prescriptionTableBody.innerHTML = "";

            prescriptions.forEach(function(prescription, index) {

                const row =
                    document.createElement("tr");

                row.innerHTML = `

                    <td>${index + 1}</td>

                    <td>${prescription.patient}</td>

                    <td>${prescription.doctor}</td>

                    <td>${prescription.medicine}</td>

                    <td>${prescription.frequency}</td>

                    <td>${prescription.date}</td>

                    <td>${prescription.instructions}</td>

                    <td>

                        <button
                            class="edit-button"
                            onclick="editPrescription(${index})">
                            Edit
                        </button>

                        <button
                            class="delete-button"
                            onclick="deletePrescription(${index})">
                            Delete
                        </button>

                    </td>

                `;

                prescriptionTableBody.appendChild(row);

            });

        }


        function editPrescription(index) {

            const prescription =
                prescriptions[index];

            patientName.value =
                prescription.patient;

            doctorName.value =
                prescription.doctor;

            medicineName.value =
                prescription.medicine;

            dosage.value =
                prescription.dosage;

            frequency.value =
                prescription.frequency;

            prescriptionDate.value =
                prescription.date;

            instructions.value =
                prescription.instructions;

            editIndex = index;

            submitButton.textContent =
                "Update Prescription";

        }


        function deletePrescription(index) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this prescription?"
                );

            if (confirmed) {

                prescriptions.splice(index, 1);

                displayPrescriptions();

            }

        }

    </script>
