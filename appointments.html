    <script>

        const appointmentForm =
            document.getElementById("appointmentForm");

        const patientName =
            document.getElementById("patientName");

        const doctorName =
            document.getElementById("doctorName");

        const appointmentDate =
            document.getElementById("appointmentDate");

        const appointmentTime =
            document.getElementById("appointmentTime");

        const appointmentStatus =
            document.getElementById("appointmentStatus");

        const appointmentTableBody =
            document.getElementById("appointmentTableBody");

        const submitButton =
            document.getElementById("submitButton");

        let appointments = [];

        let editIndex = -1;


        appointmentForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const appointment = {

                patient: patientName.value,

                doctor: doctorName.value,

                date: appointmentDate.value,

                time: appointmentTime.value,

                status: appointmentStatus.value

            };


            if (editIndex === -1) {

                appointments.push(appointment);

            } else {

                appointments[editIndex] = appointment;

                editIndex = -1;

                submitButton.textContent =
                    "Add Appointment";
            }


            appointmentForm.reset();

            displayAppointments();

        });


        function displayAppointments() {

            appointmentTableBody.innerHTML = "";

            appointments.forEach(function(appointment, index) {

                const row =
                    document.createElement("tr");

                row.innerHTML = 

                    <td>${index + 1}</td>

                    <td>${appointment.patient}</td>

                    <td>${appointment.doctor}</td>

                    <td>${appointment.date}</td>

                    <td>${appointment.time}</td>

                    <td>${appointment.status}</td>

                    <td>

                        <button
                            class="edit-button"
                            onclick="editAppointment(${index})">
                            Edit
                        </button>

                        <button
                            class="delete-button"
                            onclick="deleteAppointment(${index})">
                            Delete
                        </button>

                    </td>
                ;

                appointmentTableBody.appendChild(row);

            });

        }

            appointmentDate.value =
                appointment.date;
